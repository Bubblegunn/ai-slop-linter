name: ai-slop-linter
description: Lint the pull request title, description and changed Markdown files for AI-writing tells, with line-level annotations and one sticky review comment.
author: Efe Genc
branding:
  icon: edit-3
  color: gray-dark
inputs:
  files:
    description: Files or globs to lint, separated by spaces, or one per line when a path contains a space. A path that does not exist fails the run. Default is every .md file changed in the pull request (or every .md file on other events).
    required: false
    default: ""
  pr-body:
    description: Also lint the pull request title and description on pull_request events.
    required: false
    default: "true"
  comment:
    description: 'Post one comment on the pull request with the findings table, updated in place on every run. Needs `pull-requests: write`. Set to "false" for annotations only.'
    required: false
    default: "true"
  baseline:
    description: Path to a baseline file written with `--baseline-write`; when set, only findings the baseline does not list fail the job.
    required: false
    default: ""
  max-score:
    description: Fail when a file's score is above this number (weighted findings per 1,000 words).
    required: false
    default: "10"
  warn-only:
    description: Annotate and comment but never fail the job.
    required: false
    default: "false"
  version:
    description: ai-slop-linter version to run.
    required: false
    default: "0.1.7"
  package:
    description: For testing this Action. An npm package spec to run in place of the published `version`, such as a directory or a tarball from `npm pack`. Leave empty.
    required: false
    default: ""
outputs:
  findings:
    description: Total number of findings across the files and the pull request text.
    value: ${{ steps.lint.outputs.findings }}
runs:
  using: composite
  steps:
    - name: Lint the changed Markdown and the pull request text
      id: lint
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        PR: ${{ github.event.pull_request.number }}
        FILES: ${{ inputs.files }}
        PR_BODY: ${{ inputs.pr-body }}
        COMMENT: ${{ inputs.comment }}
        BASELINE: ${{ inputs.baseline }}
        MAX: ${{ inputs.max-score }}
        WARN: ${{ inputs.warn-only }}
        VERSION: ${{ inputs.version }}
        PACKAGE: ${{ inputs.package }}
      run: |
        set -uo pipefail
        flags=(--max-score "$MAX")
        [ "$WARN" = "true" ] && flags+=(--warn)
        [ -n "$BASELINE" ] && flags+=(--baseline --baseline-file "$BASELINE")

        # Targets: the given files, else the Markdown the pull request changed, else everything.
        if [ -n "$FILES" ]; then
          if [[ "$FILES" == *$'\n'* ]]; then
            # One path or glob per line, so a path may contain spaces. Globs reach the CLI unexpanded.
            targets=()
            while IFS= read -r f; do
              f="${f#"${f%%[![:space:]]*}"}"
              f="${f%"${f##*[![:space:]]}"}"
              [ -n "$f" ] && targets+=("$f")
            done <<< "$FILES"
            set -- ${targets[@]+"${targets[@]}"}
          else
            # shellcheck disable=SC2086
            set -- $FILES
          fi
          # A path the CLI cannot find is skipped without a word when other paths match, so a
          # path with a space in it, split in two above, used to lint nothing and pass.
          for f in "$@"; do
            case "$f" in *[*?[{]* | -) continue ;; esac
            if [ ! -e "$f" ]; then
              echo "::error title=ai-slop-linter::files: \"$f\" does not exist. The files input is split on spaces; to lint a path that contains a space, put one path per line (files: |)."
              exit 2
            fi
          done
        elif [ -n "${PR:-}" ]; then
          changed=()
          while IFS= read -r f; do [ -n "$f" ] && changed+=("$f"); done < <(gh pr diff "$PR" --name-only | grep -Ei '\.(md|mdx|markdown)$' || true)
          set -- ${changed[@]+"${changed[@]}"}
        else
          set -- '**/*.md'
        fi

        # The pull request title and description are one more text, fed on stdin.
        pr_text=""
        if [ "$PR_BODY" = "true" ] && [ "$EVENT" = "pull_request" ] && [ -n "${PR:-}" ]; then
          pr_text="$(gh pr view "$PR" --json title,body --jq '.title + "\n\n" + (.body // "")')"
          set -- "$@" -
        fi
        if [ "$#" -eq 0 ]; then
          echo "no Markdown changed and no pull request text; nothing to lint"
          echo "findings=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        run() {
          if [ -n "${PACKAGE:-}" ]; then
            printf '%s\n' "$pr_text" | npx --yes --package "$PACKAGE" -- ai-slop-linter "${flags[@]}" "$@"
          else
            printf '%s\n' "$pr_text" | npx --yes "ai-slop-linter@${VERSION}" "${flags[@]}" "$@"
          fi
        }
        # Annotations on the files tab; this exit code is the job's verdict. GitHub runs `shell: bash`
        # with -e, so a bare failing command here ended the step before the findings output and the
        # review comment were written, which is exactly the run that needs them.
        status=0
        run --format github "$@" || status=$?
        # Findings count and the comment body, from the same run in other formats.
        count=$(run --format json --warn "$@" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).reduce((n,r)=>n+r.findings.length,0)))')
        echo "findings=${count}" >> "$GITHUB_OUTPUT"

        if [ "$COMMENT" = "true" ] && [ "$EVENT" = "pull_request" ] && [ -n "${PR:-}" ]; then
          marker='<!-- ai-slop-linter -->'
          body_file="$(mktemp)"
          { printf '%s\n' "$marker"; run --format markdown --warn "$@" | sed 's/^| stdin/| pull request text/'; } > "$body_file"
          existing=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" 2>/dev/null | head -1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -F "body=@${body_file}" >/dev/null && echo "updated the review comment"
          elif [ "$count" != "0" ]; then
            gh api "repos/${REPO}/issues/${PR}/comments" -F "body=@${body_file}" >/dev/null && echo "posted the review comment"
          else
            echo "no findings and no earlier comment; nothing to post"
          fi
        fi
        exit "$status"
