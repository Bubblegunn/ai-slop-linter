name: release
on:
  push:
    tags: ["v*.*.*"] # release tags only; the moving major tag (v0) must not start a publish
permissions:
  contents: read
# GitHub has delivered one tag push twice (product-engineer v0.5.0, 2026-10-14: two runs one second
# apart; the second failed with npm E409 on a version the first had published). Runs for one tag
# now queue instead of racing, and each step below is safe to run a second time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    # The glob above cannot exclude a suffix: "v*.*.*" also matches v0.1.6-pre-commit, the rev
    # pre-commit users pin, which scripts/release.mjs creates beside every release. That tag is the
    # same release plus built output, not a separate version, so publishing it is meaningless. The
    # version guard below already refuses it, but a red run on every release teaches people to
    # ignore red runs. Skip it instead.
    if: ${{ !endsWith(github.ref_name, '-pre-commit') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC); provenance is attached automatically
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # a release builds from a clean install; nothing cached can reach it
      - name: The tag must name the version in package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$TAG" ]; then echo "tag $TAG does not match package.json version $v; run npm run release instead of tagging by hand"; exit 1; fi
        env:
          TAG: ${{ github.ref_name }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Publish, unless this exact package is already on npm
        run: |
          # A second run for the same tag must not fail on a version the first one published, and
          # must not pass over a version published with different contents. The integrity of the
          # tarball built here is compared with what the registry already holds.
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name@$version" dist.integrity 2>/dev/null || true)
          if [ -z "$published" ]; then
            npm publish --access public
            exit 0
          fi
          local_integrity=$(npm pack --dry-run --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const p=Array.isArray(j)?j[0]:Object.values(j)[0];console.log(p.integrity)})')
          if [ "$published" = "$local_integrity" ]; then
            echo "$name@$version is already on npm with identical contents ($published); not publishing again"
          else
            echo "$name@$version is already on npm with different contents: registry $published, this build $local_integrity"
            exit 1
          fi
      - name: Release notes are the CHANGELOG entry, then the generated list of pull requests
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --notes-file notes.md
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  smoke:
    # The published package, installed from the registry on three operating systems, reports the released version.
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # nothing here should come from a cache a pull request could have written
      - name: npx the released version from the registry
        shell: bash
        run: |
          # This step is the only proof that what was published installs and runs, and until
          # 2026-09-12 it could not fail. The old check searched the output for the version
          # string anywhere, and npm's own failure text quotes it back:
          #
          #   npm error notarget No matching version found for ai-slop-linter@0.1.5.
          #
          # So six exhausted retries against a registry that was still processing the publish
          # printed "smoke ok" and the job went green. Installing is now tracked separately from
          # what was printed, and the printed version must equal the released one exactly.
          #
          # The retry gates on npx's exit status, but the comparison below read a variable with
          # stderr merged into it, so whatever npm printed last decided the verdict. Emulated with
          # npm's update notifier, which writes to stderr as the command exits: the comparison read
          # "npmnotice" and failed a release that had installed and printed the right version.
          # Reported by @build996. stderr is captured apart from the output now, and is still shown
          # on every path that fails.
          v="${TAG#v}"
          installed=""
          err=$(mktemp)
          # Six attempts over two minutes was not enough. product-engineer 0.4.0 published cleanly on
          # 2026-09-21 and the registry was still answering ETARGET when the window closed, so a
          # release that had worked went red and the only real check on it reported nothing. The
          # budget is named once and the message is computed from it, because the old message spelled
          # "six" and "two minutes" in words that nothing would have updated.
          attempts=30 # 15 (five minutes) ran out on three releases on 2026-10-14 while npm was still propagating
          delay=20
          i=1
          while [ "$i" -le "$attempts" ]; do
            if out=$(npx --yes "$PKG@$v" --version 2>"$err"); then installed=yes; break; fi
            echo "attempt $i of $attempts did not install:"; cat "$err"
            i=$((i + 1))
            if [ "$i" -le "$attempts" ]; then sleep "$delay"; fi
          done
          if [ -z "$installed" ]; then
            echo "the registry never served $PKG@$v: $attempts attempts over about $((attempts * delay / 60)) minutes all failed"
            cat "$err"
            exit 1
          fi
          echo "$out"
          printed=$(printf '%s' "$out" | tr -d '\r' | tail -n 1 | tr -d '[:space:]')
          if [ "$printed" != "$v" ]; then
            echo "installed, but --version printed '$printed' where $v was expected"
            echo "stderr from that run:"; cat "$err"
            exit 1
          fi
          echo "smoke ok: $PKG@$v"
        env:
          TAG: ${{ github.ref_name }}
          PKG: ${{ github.event.repository.name }}
      - name: The installed package carries a verified registry signature and provenance
        shell: bash
        run: | # zizmor: ignore[adhoc-packages] installing the just-published version is what this step checks
          # publishConfig.provenance is on, and nothing checked what users receive. This installs
          # the release into an empty project and asks npm to verify it. `npm audit signatures`
          # exits 0 when a package has a registry signature and no attestation at all, so the
          # attestation line is required explicitly: without it, a publish that lost provenance
          # would still pass.
          v="${TAG#v}"
          dir=$(mktemp -d)
          cd "$dir"
          npm init -y >/dev/null
          attempts=30 # 15 (five minutes) ran out on three releases on 2026-10-14 while npm was still propagating
          delay=20
          i=1
          until npm install --no-audit --no-fund "$PKG@$v"; do
            if [ "$i" -ge "$attempts" ]; then echo "npm install $PKG@$v failed $attempts times"; exit 1; fi
            echo "attempt $i of $attempts did not install; retrying in ${delay}s"
            i=$((i + 1))
            sleep "$delay"
          done
          out=$(npm audit signatures 2>&1) || { echo "$out"; echo "npm audit signatures failed for $PKG@$v"; exit 1; }
          echo "$out"
          case "$out" in
            *"verified attestation"*) echo "provenance ok: $PKG@$v" ;;
            *) echo "$PKG@$v has a registry signature but no verified provenance attestation"; exit 1 ;;
          esac
        env:
          TAG: ${{ github.ref_name }}
          PKG: ${{ github.event.repository.name }}
      - name: The moving major tag and the pre-commit tag point at this release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # scripts/release.mjs moves the major tag (v0) and pushes vX.Y.Z-pre-commit from the
          # maintainer's machine after the release tag, so the workflow never sees them go wrong.
          # If either step fails, `uses: ...@v0` and `rev: vX.Y.Z-pre-commit` stay on the old
          # release with no signal. Retried, because both are pushed after the tag that started
          # this run.
          v="${TAG#v}"
          major="v${v%%.*}"
          hooks="${TAG}-pre-commit"
          url="https://github.com/${REPO}.git"
          # The commit a tag names: the peeled ^{} line for an annotated tag, else the tag itself.
          commit_of() {
            local lines
            lines=$(git ls-remote "$url" "refs/tags/$1" "refs/tags/$1^{}") || return 1
            printf '%s\n' "$lines" | awk -v t="refs/tags/$1" '$2 == t "^{}" { p = $1 } $2 == t { d = $1 } END { print (p != "" ? p : d) }'
          }
          attempts=${ATTEMPTS:-30}
          delay=${DELAY:-20}
          i=1
          while :; do
            problems=""
            release=$(commit_of "$TAG") || release=""
            moving=$(commit_of "$major") || moving=""
            [ -n "$release" ] || problems="$problems; $TAG does not exist on $url"
            [ -n "$release" ] && [ "$moving" != "$release" ] && problems="$problems; $major is at '${moving:-missing}', not at $TAG ($release)"
            tree=$(mktemp -d)
            if git -C "$tree" init -q && git -C "$tree" fetch -q --depth 1 "$url" "refs/tags/$hooks" 2>/dev/null; then
              [ "$(git -C "$tree" ls-tree --name-only FETCH_HEAD dist/src/cli.js)" = dist/src/cli.js ] || problems="$problems; $hooks has no dist/src/cli.js, so pre-commit would find no executable"
            else
              problems="$problems; $hooks could not be fetched from $url"
            fi
            rm -rf "$tree"
            [ -z "$problems" ] && break
            echo "attempt $i of $attempts:${problems#;}"
            if [ "$i" -ge "$attempts" ]; then exit 1; fi
            i=$((i + 1))
            sleep "$delay"
          done
          echo "tags ok: $major and $TAG at $release, $hooks carries dist/src/cli.js"
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
