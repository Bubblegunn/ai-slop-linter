name: ci
on:
  push:
    branches: [main]
  pull_request:
  # A Dependabot auto-merge pushes with GITHUB_TOKEN, which starts no workflow, so main can sit
  # on commits CI never ran and the release script waits for a run that never comes. The nightly
  # run checks main within a day of any bot merge; workflow_dispatch lets a person start one now.
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Lint this repository's own Markdown with the built linter (.slop.json, maxScore 3)
        run: node dist/src/cli.js
        if: runner.os != 'Windows'
  package:
    # The tarball people install, checked before a tag exists: exports, types, bin, and a real install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx publint --strict
      - run: npx attw --pack . --ignore-rules cjs-resolves-to-esm # ESM only, by design
      - name: Install the packed tarball in an empty project and run it
        run: sh scripts/smoke-tarball.sh
  release-gate:
    # The version the package states is the version every other file states, and npm pack ships only allowlisted paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --if-present
      - run: node scripts/release-gate.mjs
  bench:
    # The committed precision and typography tables, and the README's demo block, match a
    # fresh run. The demo block is here because it went stale when the rules changed and
    # nothing caught it: a visitor running the advertised command got different output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node bench/precision.mjs --check
      - run: node bench/typography.mjs --check
      - run: node scripts/readme-demo.mjs --check
  action:
    # The composite Action itself, run with `uses: ./` against the package built from this
    # commit (the `package` input), so the bash in action.yml is tested before it ships and not
    # by the first user whose run breaks. test/action.test.mjs covers its argument handling in
    # more cases; this job proves the real Action wiring: the findings output, the exit code
    # and warn-only, on the fixtures. zizmor 1.30 prefers GitHub's `$/` self-repository form
    # (July 2026) to `./`; it can replace `./` once it has been tried in this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack this commit, and count the sloppy fixture's findings with the CLI
        id: prep
        run: |
          echo "tarball=$PWD/$(npm pack --ignore-scripts --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
          count=$(node dist/src/cli.js --format json --warn test/fixtures/sloppy.md | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).reduce((n,r)=>n+r.findings.length,0)))')
          echo "expected=$count" >> "$GITHUB_OUTPUT"
          mkdir -p "space dir"
          cp test/fixtures/sloppy.md "space dir/sloppy copy.md"
      - name: Sloppy fixture, warn-only
        id: sloppy
        uses: ./ # zizmor: ignore[self-repository] the checkout above is this commit
        with:
          files: test/fixtures/sloppy.md
          warn-only: "true"
          comment: "false"
          pr-body: "false"
          package: ${{ steps.prep.outputs.tarball }}
      - name: Sloppy fixture, failing
        id: strict
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] the checkout above is this commit
        with:
          files: test/fixtures/sloppy.md
          warn-only: "false"
          comment: "false"
          pr-body: "false"
          package: ${{ steps.prep.outputs.tarball }}
      - name: Clean fixture
        id: clean
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] the checkout above is this commit
        with:
          files: test/fixtures/clean.md
          warn-only: "false"
          comment: "false"
          pr-body: "false"
          package: ${{ steps.prep.outputs.tarball }}
      - name: A path with a space, one per line
        id: spaced
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] the checkout above is this commit
        with:
          files: |
            space dir/sloppy copy.md
          warn-only: "true"
          comment: "false"
          pr-body: "false"
          package: ${{ steps.prep.outputs.tarball }}
      - name: A path with a space on one line is rejected
        id: spaced-one-line
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] the checkout above is this commit
        with:
          files: space dir/sloppy copy.md
          warn-only: "true"
          comment: "false"
          pr-body: "false"
          package: ${{ steps.prep.outputs.tarball }}
      - name: The outputs and outcomes are the ones the Action promises
        run: |
          fail=0
          check() { if [ "$2" = "$3" ]; then echo "ok: $1"; else echo "::error::$1: expected '$3', got '$2'"; fail=1; fi; }
          [ "$EXPECTED" -gt 0 ] || { echo "::error::the CLI counted no findings on the sloppy fixture, so the comparison below proves nothing"; fail=1; }
          check "warn-only run passes" "$SLOPPY_OUTCOME" success
          check "findings output equals the CLI's --format json count" "$SLOPPY" "$EXPECTED"
          check "warn-only false fails on the sloppy fixture" "$STRICT_OUTCOME" failure
          check "the failing run still reports the same count" "$STRICT" "$EXPECTED"
          check "clean fixture passes" "$CLEAN_OUTCOME" success
          check "clean fixture has 0 findings" "$CLEAN" 0
          check "a path with a space, one per line, is linted" "$SPACED_OUTCOME" success
          check "and counted" "$SPACED" "$EXPECTED"
          check "a path with a space on one line is rejected" "$SPACED_ONE_LINE_OUTCOME" failure
          exit "$fail"
        env:
          EXPECTED: ${{ steps.prep.outputs.expected }}
          SLOPPY: ${{ steps.sloppy.outputs.findings }}
          SLOPPY_OUTCOME: ${{ steps.sloppy.outcome }}
          STRICT: ${{ steps.strict.outputs.findings }}
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
          CLEAN: ${{ steps.clean.outputs.findings }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          SPACED: ${{ steps.spaced.outputs.findings }}
          SPACED_OUTCOME: ${{ steps.spaced.outcome }}
          SPACED_ONE_LINE_OUTCOME: ${{ steps.spaced-one-line.outcome }}
  coverage:
    # Node's built-in coverage over the shipped dist/src, on one leg. scripts/coverage.mjs holds
    # the thresholds and checks them itself, because Node reads its own threshold flags as whole
    # numbers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run coverage
  ci-ok:
    # The one check the branch ruleset requires; it fails if any job above failed or was cancelled.
    if: always()
    needs: [test, package, release-gate, bench, coverage, action]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}  package: ${{ needs.package.result }}  release-gate: ${{ needs.release-gate.result }}  bench: ${{ needs.bench.result }}  coverage: ${{ needs.coverage.result }}  action: ${{ needs.action.result }}"
          test "${{ needs.test.result }}" = success && test "${{ needs.package.result }}" = success && test "${{ needs.release-gate.result }}" = success && test "${{ needs.bench.result }}" = success && test "${{ needs.coverage.result }}" = success && test "${{ needs.action.result }}" = success
